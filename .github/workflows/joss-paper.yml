name: JOSS paper draft

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper/paper.md'
      - 'paper/paper.bib'
      - 'paper/figures/**'
      - 'tests/check-paper.py'
      - 'paper/make_review_copy.py'
      - '.github/workflows/joss-paper.yml'
  pull_request:
    paths:
      - 'paper/paper.md'
      - 'paper/paper.bib'
      - 'paper/figures/**'
      - 'tests/check-paper.py'
      - 'paper/make_review_copy.py'
      - '.github/workflows/joss-paper.yml'

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out manuscript and sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate manuscript references and files
        run: python3 -B tests/check-paper.py
      - name: Build with the official Open Journals toolchain
        uses: openjournals/openjournals-draft-action@85a18372e48f551d8af9ddb7a747de685fbbb01c
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Create watermark-free author-review copy and retain original
        run: |
          python3 -m pip install pypdf==6.10.0 pillow==12.3.0
          mv paper/paper.pdf paper/paper-joss-draft.pdf
          python3 -B paper/make_review_copy.py paper/paper-joss-draft.pdf paper/paper.pdf
      - name: Upload JOSS-format PDF for author review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: octview3r-joss-paper
          path: |
            paper/paper.pdf
            paper/paper-joss-draft.pdf
          if-no-files-found: error
          retention-days: 30
